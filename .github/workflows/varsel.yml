name: Varsel til dei på vakt
on:
  schedule:
    - cron: "55 7 * * *"
    - cron: "55 8 * * *"
    - cron: "55 9 * * *"
    - cron: "55 10 * * *"
    - cron: "25 14 * * *"
    - cron: "25 15 * * *"
    - cron: "55 15 * * *"
    - cron: "55 16 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send testvarsel: skriv «alle» eller ein person-ID"
        required: false
        default: "alle"
      slot:
        description: "…eller send eit vanleg varsel no (10:00, 12:00, 16:30 eller 19:00)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: varsel
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node varsel/send.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SCHEDULE: ${{ github.event.schedule }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.slot == '' && inputs.test || '' }}
          SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
